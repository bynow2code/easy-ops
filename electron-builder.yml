appId: com.easyops.app
productName: EasyOps
copyright: Copyright © 2026 bynow2code

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asarUnpack:
  - '**/node_modules/node-pty/**'

extraMetadata:
  main: out/main/index.js

npmRebuild: true

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

publish:
  provider: github
  owner: bynow2code
  repo: easy-ops
  # 必须显式声明:GitHub 发布器的 releaseType 默认取 "draft"(
  # electron-publish/out/gitHubPublisher.js:55,因为 packager options 里 draft 为 undefined),
  # 而 draft 发布器遇到「已发布的 Release」会直接 return null 并跳过全部上传(同文件 :69-83),
  # job 仍然退出码 0 —— 静默失败。只有 info.releaseType 有值时才按配置走(同文件 :46-47)。
  releaseType: release

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  category: Development
  # 让安装进系统的 .desktop 跟随 package.json 的 desktopName。缺了它,Electron 会把
  # app_id / WM_CLASS 取成 desktopName(缺省 <name>.desktop → "easyops"),而这里生成的
  # StartupWMClass 会 fallback 到 productName("EasyOps")—— 大小写不一致,桌面环境就
  # 关联不上运行中的窗口,任务栏读不到 .desktop 里的 Icon=。
  syncDesktopName: true
  # AppImage 是便携格式:它的 AppRun 只设 PATH/LD_LIBRARY_PATH 然后 exec,不会把
  # .desktop 与图标装进系统,于是任务栏只能回落到窗口自身的 _NET_WM_ICON。
  # 把这份图标打进 resources/,主进程在 Linux 打包后据此 setIcon。
  extraResources:
    - from: build/icon.png
      to: icon.png
  # deb 包必须有 maintainer,而 package.json 的 author 没有邮箱。
  # 用 GitHub noreply 身份而非个人邮箱:此字段会写进 deb/rpm 控制信息并随公开 Release 分发
  maintainer: EasyOps <bynow2code@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
